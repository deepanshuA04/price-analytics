[project]
name = "price-analytics"
version = "0.1.0"
description = "E-commerce price & assortment analytics: scheduled ETL, SQLite warehouse, and a Power BI repricing dashboard"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_analytics"]

name: Daily collection

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pipeline (collect, load, quality gates)
        run: uv run python -m price_analytics.pipeline

      - name: Commit raw data and warehouse
        if: always()
        run: |
          git config user.name "price-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw/ warehouse/ powerbi/
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Daily collection: $(date -u +%Y-%m-%d)"
            git push
          fi
